# ==========================================
# 运存防线 RAM 配置文件
# 修改后无需重启手机，模块会自动重载配置
# 以 # 或 ; 开头的行为注释
# ==========================================


# ========== 内存阈值 ==========

# 可用物理内存低于该百分比时开始清理后台 App
# 建议范围：8-15
start_mem_percent=12

# 清理到该可用物理内存百分比后停止
# 建议比 start_mem_percent 高 4-8
target_mem_percent=25

# 可用物理内存低于该百分比时进入紧急模式
# 紧急模式下一次允许清理更多后台 App
emergency_mem_percent=7


# ========== Swap / Zram 压力 ==========

# Swap / Zram 剩余低于该百分比时，也认为内存压力较高
# 没有 Swap / Zram 的设备会自动忽略
swap_free_start_percent=15

# Swap / Zram 剩余低于该百分比时进入紧急内存压力
swap_free_emergency_percent=10


# ========== 前台切换后的临时监控 ==========

# 前台 App 切换后，延迟多少秒开始临时监控
# 作用：避免刚打开 App 时立即清理造成卡顿
monitor_delay_sec=6

# 临时监控期间，每隔多少秒采样一次内存
monitor_interval_sec=10

# 每次前台切换后，最多监控多少秒
# 到时间后自动休眠，不会一直轮询
monitor_duration_sec=90


# ========== 清理行为 ==========

# 前台切换后至少等待多少毫秒才允许清理
# 作用：降低切换 App 瞬间的 UI 卡顿
clean_delay_after_switch_ms=2000

# 普通模式下一次最多清理几个后台 App
# 建议 1-2，太大会增加卡顿风险
max_clean_count=10

# 紧急模式下一次最多清理几个后台 App
emergency_max_clean_count=15

# 每清理一个 App 后等待多少毫秒再继续
clean_interval_ms=1000

# 两次普通清理之间的冷却时间，单位秒
clean_cooldown_sec=30


# ========== 日志 ==========

# 是否启用日志
enable_log=true

# 日志最大大小，单位 KB
log_max_size_kb=512


# ========== 状态栏通知 ==========

# 是否在状态栏显示运行状态通知false/true
# 显示：清理应用个数、上次释放内存、累计释放内存
enable_status_notification=true
